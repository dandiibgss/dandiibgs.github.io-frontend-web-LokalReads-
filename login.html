<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - LokalReads</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* Anti-Bentrokan Bootstrap */
        a {
            text-decoration: none !important;
            color: inherit;
        }
        a:hover {
            color: inherit;
        }
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }
        @font-face {
            font-family: 'PP Writer';
            src: url('asset/PPWriter-Bold.otf') format('opentype');
        }

        /* CSS RESET */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Medium.otf') format('opentype');
            font-weight: 500;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Semibold.otf') format('opentype');
            font-weight: 600;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Black.otf') format('opentype');
            font-weight: 900;
            font-style: normal;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
            background-color: #F9FAFB;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        input, select, textarea, button {
            font-family: inherit;
        }

        /* CARD CONTAINER */
        .login-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #1A1A1A;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6B7280;
            font-size: 14px;
            margin-bottom: 35px;
        }

        /* FORM STYLING */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 8px;
            color: #1A1A1A;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #F3F4F6;
            background-color: #F9FAFB;
            border-radius: 12px;
            font-size: 15px;
            color: #1A1A1A;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #1A1A1A;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.05);
        }

        /* ERROR MESSAGE */
        .error-message {
            color: #EF4444;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            text-align: left;
            background-color: #FEE2E2;
            padding: 12px;
            border-radius: 8px;
        }

        /* BUTTONS */
        .btn-submit {
            width: 100%;
            background: #1A1A1A;
            color: #FFFFFF;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn-submit:hover {
            background: #374151;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .register-link {
            margin-top: 25px;
            font-size: 14px;
            color: #6B7280;
        }

        .register-link a {
            color: #1A1A1A;
            text-decoration: none;
            font-weight: 800;
        }

        .back-to-home {
            margin-top: 15px;
            display: inline-block;
            color: #9CA3AF;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-to-home:hover {
            color: #1A1A1A;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .login-card {
                padding: 24px 16px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                margin-bottom: 25px;
            }

            input {
                padding: 12px 14px;
            }

            .btn-submit {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <img src="asset/lokalreads_horizontal_logo_black.png" alt="LokalReads"
            style="height: 38px; margin-bottom: 20px; object-fit: contain;">
        <h1>Masuk</h1>
        <p class="subtitle">Silakan masukkan akun Anda untuk melanjutkan membaca.</p>

        <div class="error-message" id="errorMessage">Email atau password salah. Silakan coba lagi.</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="contoh@email.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan kata sandi" required>
            </div>

            <button type="submit" class="btn-submit">Masuk</button>
        </form>

        <p class="register-link">Belum punya akun? <a href="register_read.html">Daftar Sekarang</a></p>
        <a href="index.html" class="back-to-home"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
    </div>

    <script>
        // Cek jika sudah login, langsung lempar ke dashboard
        const existingUser = JSON.parse(localStorage.getItem('currentUser'));
        if (existingUser) {
            window.location.href = "dashboard_user.html";
        }

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');

            // Ambil daftar pengguna terdaftar dari localStorage
            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers')) || [];

            // Cari user yang cocok
            const userMatch = registeredUsers.find(u => u.email === email && u.password === password);

            if (userMatch) {
                // Set sesi login aktif
                localStorage.setItem('currentUser', JSON.stringify(userMatch));
                // Alihkan ke Dashboard
                window.location.href = "dashboard_user.html";
            } else {
                // Tampilkan pesan error
                errorEl.style.display = "block";
            }
        });
    </script>
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
