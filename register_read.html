<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun LokalReads</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* Anti-Bentrokan Bootstrap */
        a {
            text-decoration: none !important;
            color: inherit;
        }
        a:hover {
            color: inherit;
        }
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }
        @font-face {
            font-family: 'PP Writer';
            src: url('asset/PPWriter-Bold.otf') format('opentype');
        }

        /* CSS RESET */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Medium.otf') format('opentype');
            font-weight: 500;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Semibold.otf') format('opentype');
            font-weight: 600;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Black.otf') format('opentype');
            font-weight: 900;
            font-style: normal;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
            background-color: #F9FAFB;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        input, select, textarea, button {
            font-family: inherit;
        }

        /* CARD CONTAINER */
        .register-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #1A1A1A;
            margin-bottom: 8px;
        }

        .step-indicator {
            color: #6B7280;
            font-size: 14px;
            margin-bottom: 35px;
        }

        /* FORM STYLING */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 8px;
            color: #1A1A1A;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #F3F4F6;
            background-color: #F9FAFB;
            border-radius: 12px;
            font-size: 15px;
            color: #1A1A1A;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #1A1A1A;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.05);
        }

        /* ROLE SELECTOR */
        .role-box {
            border: 2px solid #D1D5DB;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            background: #FFFFFF;
            transition: all 0.2s ease;
        }

        .role-box:hover {
            border-color: #9CA3AF;
        }

        .role-box.selected {
            border-color: #1A1A1A;
        }

        .radio-circle {
            width: 20px;
            height: 20px;
            border: 2px solid #D1D5DB;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s ease;
        }

        .role-box:hover .radio-circle {
            border-color: #9CA3AF;
        }

        .role-box.selected .radio-circle {
            border-color: #1A1A1A;
        }

        .radio-inner {
            width: 10px;
            height: 10px;
            background: #1A1A1A;
            border-radius: 50%;
            transform: scale(0);
            transition: transform 0.2s ease;
        }

        .role-box.selected .radio-inner {
            transform: scale(1);
        }

        .role-text {
            font-weight: 700;
            font-size: 16px;
            display: block;
        }

        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .role-box .role-info {
            line-height: 1.2;
        }

        .role-desc {
            display: block;
            font-size: 12px;
            color: #9CA3AF;
            font-weight: 500;
            margin-top: 2px;
        }

        /* BUTTONS */
        .btn-submit {
            width: 100%;
            background: #1A1A1A;
            color: #FFFFFF;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn-submit:hover {
            background: #374151;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .login-link {
            margin-top: 25px;
            font-size: 14px;
            color: #6B7280;
        }

        .login-link a {
            color: #1A1A1A;
            text-decoration: none;
            font-weight: 800;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .register-card {
                padding: 24px 16px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .step-indicator {
                margin-bottom: 25px;
            }

            input {
                padding: 12px 14px;
            }

            .role-grid {
                grid-template-columns: 1fr;
            }

            .btn-submit {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="register-card">
        <img src="asset/lokalreads_horizontal_logo_black.png" alt="LokalReads"
            style="height: 38px; margin-bottom: 20px; object-fit: contain;">
        <h1>Buat Akun</h1>
        <p class="step-indicator">Step 1 dari 2</p>

        <form id="registerForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" name="fullname" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="form-group">
                <label>Tanggal Lahir</label>
                <input type="date" name="birthdate" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="contoh@email.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Buat kata sandi" required>
            </div>

            <input type="hidden" name="role" id="roleInput" value="reader">

            <button type="submit" class="btn-submit">Lanjutkan</button>
        </form>

        <p class="login-link">Sudah punya akun? <a href="login.html">Masuk</a></p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();

            var role = this.role.value;

            var data = {
                fullname: this.fullname.value,
                birthdate: this.birthdate.value,
                email: this.email.value,
                password: this.password.value,
                role: role
            };

            var registeredUsers = JSON.parse(localStorage.getItem('registeredUsers')) || [];
            if (registeredUsers.some(function (u) { return u.email === data.email; })) {
                alert('Email ini sudah terdaftar. Silakan masuk.');
                return;
            }

            // Pembaca: lanjut ke langkah pemilihan genre
            sessionStorage.setItem('pendingUser', JSON.stringify(data));
            window.location.href = 'process_register.html';
        });
    </script>
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
