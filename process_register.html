<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Genre Favorit - LokalReads</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* Anti-Bentrokan Bootstrap */
        a {
            text-decoration: none !important;
            color: inherit;
        }
        a:hover {
            color: inherit;
        }
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }
        @font-face {
            font-family: 'PP Writer';
            src: url('asset/PPWriter-Bold.otf') format('opentype');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Medium.otf') format('opentype');
            font-weight: 500;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Semibold.otf') format('opentype');
            font-weight: 600;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: url('asset/SF Pro Display/SF-Pro-Display-Black.otf') format('opentype');
            font-weight: 900;
            font-style: normal;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
            background-color: #FFFFFF;
            color: #1A1A1A;
            min-height: 100vh;
        }

        input, select, textarea, button {
            font-family: inherit;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: #FFFFFF;
            border-bottom: 1px solid #F3F4F6;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 800;
            text-decoration: none;
            color: #1A1A1A;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
            padding-bottom: 40px;
        }

        .genre-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 600px;
            padding: 50px 40px;
            border: 1px solid #E5E7EB;
            border-radius: 24px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .step-info {
            color: #6B7280;
            font-size: 16px;
            margin-bottom: 40px;
            transition: color 0.3s;
        }

        .genre-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 50px;
        }

        .genre-checkbox {
            display: none;
        }

        .genre-label {
            padding: 10px 24px;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #4B5563;
            cursor: pointer;
            transition: all 0.2s;
        }

        .genre-checkbox:checked+.genre-label {
            background-color: #1A1A1A;
            color: #FFFFFF;
            border-color: #1A1A1A;
        }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-back {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            color: #1A1A1A;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-next {
            background: #1A1A1A;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-next:disabled {
            background: #E5E7EB;
            color: #9CA3AF;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            nav {
                padding: 15px 20px;
            }

            .container {
                padding: 30px 15px;
            }

            .genre-card {
                padding: 30px 15px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .step-info {
                margin-bottom: 25px;
            }

            .genre-grid {
                margin-bottom: 30px;
                gap: 8px;
            }

            .genre-label {
                padding: 8px 16px;
                font-size: 13px;
            }

            .action-btns {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .btn-back, .btn-next {
                padding: 14px;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="logo">
            <img src="asset/lokalreads_horizontal_logo_black.png" alt="LokalReads"
                style="height: 38px; object-fit: contain;">
        </a>
    </nav>

    <div class="container">
        <div class="genre-card">
            <h1 id="welcomeTitle">Pilih Genre Favorit</h1>
            <p class="step-info" id="status-text">Step 2 dari 2 - Pilih minimal 3 genre</p>

            <form id="genreForm">
                <div class="genre-grid" id="genreGrid">
                    <!-- Genre akan di-render menggunakan JavaScript -->
                </div>

                <div class="action-btns">
                    <a href="register_read.html" class="btn-back">Kembali</a>
                    <button type="submit" class="btn-next" id="submitBtn" disabled>Selesai</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Cek data pendaftaran sementara
        const pendingUser = JSON.parse(sessionStorage.getItem('pendingUser'));
        if (!pendingUser) {
            // Jika tidak ada data sementara, kembalikan ke halaman pendaftaran
            window.location.href = "register_read.html";
        } else {
            // Beri salam kepada user
            document.getElementById('welcomeTitle').innerText = `Halo ${pendingUser.fullname}, Pilih Genre Favorit`;
        }

        const genres = ["Fiksi", "Non-Fiksi", "Bisnis", "Self-Help", "Sejarah", "Biografi", "Kuliner", "Teknologi", "Religi", "Seni"];
        const genreGrid = document.getElementById('genreGrid');

        // Render genre checkboxes
        genres.forEach((genre, index) => {
            const input = document.createElement('input');
            input.type = 'checkbox';
            input.name = 'genres';
            input.value = genre;
            input.id = `genre-${index}`;
            input.className = 'genre-checkbox';
            input.onchange = validateGenres;

            const label = document.createElement('label');
            label.htmlFor = `genre-${index}`;
            label.className = 'genre-label';
            label.innerText = genre;

            genreGrid.appendChild(input);
            genreGrid.appendChild(label);
        });

        function validateGenres() {
            const checkboxes = document.querySelectorAll('input[name="genres"]:checked');
            const submitBtn = document.getElementById('submitBtn');
            const statusText = document.getElementById('status-text');

            if (checkboxes.length >= 3) {
                submitBtn.disabled = false;
                statusText.style.color = "#10B981"; // Hijau
                statusText.innerHTML = "Siap untuk lanjut!";
            } else {
                submitBtn.disabled = true;
                statusText.style.color = "#6B7280"; // Abu-abu
                statusText.innerHTML = `Pilih minimal 3 genre (${checkboxes.length} terpilih)`;
            }
        }

        document.getElementById('genreForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const selectedCheckboxes = document.querySelectorAll('input[name="genres"]:checked');
            const selectedGenres = Array.from(selectedCheckboxes).map(cb => cb.value);

            // Buat objek user yang lengkap
            const completedUser = {
                ...pendingUser,
                genres: selectedGenres
            };

            // Simpan ke daftar user terdaftar di localStorage
            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers')) || [];

            // Cek apakah email sudah terdaftar
            const emailExists = registeredUsers.some(u => u.email === completedUser.email);
            if (!emailExists) {
                registeredUsers.push(completedUser);
                localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
            }

            // Set user saat ini sebagai yang sedang login
            localStorage.setItem('currentUser', JSON.stringify(completedUser));

            // Bersihkan data sementara di sessionStorage
            sessionStorage.removeItem('pendingUser');

            // Redirect ke Dashboard User
            window.location.href = "dashboard_user.html";
        });
    </script>
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
